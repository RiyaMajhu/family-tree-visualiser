<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Family Tree Visualiser</title>
  <link rel="stylesheet" href="https://unpkg.com/family-chart@0.9.0/dist/styles/family-chart.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #efe9dc;
      --ink: #3a3226;
      --line: #8c7f6a;
      --male: #dfe5da;
      --female: #ecdcd2;
      --highlight: #8a3b2e;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Source Sans 3", sans-serif;
    }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: baseline; gap: 24px;
      padding: 16px 28px 12px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-family: "Libre Baskerville", serif;
      font-size: 22px; font-weight: 700;
    }
    #search {
      width: 300px; padding: 6px 2px; font-size: 15px;
      font-family: inherit; color: var(--ink);
      background: transparent;
      border: none; border-bottom: 1px solid var(--line); outline: none;
    }
    #search:focus { border-bottom-color: var(--highlight); }

    #home, #set-home {
      padding: 6px 14px; font-size: 14px; font-family: inherit;
      color: var(--ink); background: transparent;
      border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
    }
    #home:hover, #set-home:hover { border-color: var(--highlight); color: var(--highlight); }
    #set-home:disabled { opacity: 0.4; cursor: default; }
    #set-home:disabled:hover { border-color: var(--line); color: var(--ink); }

    #showing { margin: 0 0 0 auto; font-size: 15px; }
    #showing strong { font-family: "Libre Baskerville", serif; }

    #hint {
      position: fixed; bottom: 12px; left: 28px; z-index: 10;
      margin: 0; font-size: 13px; color: var(--line);
    }

    #FamilyChart { width: calc(100vw - 320px); height: 100vh; }

    /* details panel on the right */
    #details {
      position: fixed; top: 60px; right: 0; bottom: 0; z-index: 5;
      width: 320px; box-sizing: border-box;
      padding: 20px 22px; overflow-y: auto;
      background: var(--paper);
      border-left: 1px solid var(--line);
      font-size: 14px;
    }
    #details h2 {
      margin: 0; font-family: "Libre Baskerville", serif; font-size: 20px;
    }
    #details .years { margin: 4px 0 16px; color: var(--line); }
    #details h3 {
      margin: 18px 0 6px; padding-bottom: 3px;
      font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--highlight); border-bottom: 1px solid #d8cfbd;
    }
    #details h4 { margin: 10px 0 4px; font-size: 14px; font-weight: 600; }
    #details ul { margin: 0; padding-left: 18px; }
    #details li { margin: 3px 0; }
    #details .note { color: var(--line); font-style: italic; }
    #details a { color: var(--ink); cursor: pointer; text-decoration: underline dotted; }
    #details a:hover { color: var(--highlight); }

    .f3 {
      --background-color: var(--paper);
      --text-color: var(--ink);
      --male-color: var(--male);
      --female-color: var(--female);
      --genderless-color: #e4e0d8;
    }

    /* flat cards with a thin border, like boxes on a hand-drawn tree */
    .f3 div.card .card-inner {
      border-radius: 2px !important;
      border: 1px solid var(--line);
      box-shadow: none !important;
      outline: none !important;
      color: var(--ink);
      font-family: "Source Sans 3", sans-serif;
    }
    /* the name (first line on each card) */
    .f3 div.card .card-inner > div:first-child {
      font-family: "Libre Baskerville", serif;
      font-size: 14px;
    }

    /* the person the tree is centred on */
    .f3 div.card.card-main .card-inner {
      border: 2px solid var(--highlight);
    }

    /* the relationship label, e.g. "Father" or "Half-sister" */
    .f3 div.card .card-inner > div:last-child {
      margin-top: 3px;
      font-size: 12px; font-style: italic; color: var(--highlight);
    }

    .f3 .link { stroke: var(--line); }
  </style>
</head>
<body>
  <!-- top bar: title and search box (the datalist gets filled with everyone's names below) -->
  <header>
    <h1>Family Tree</h1>
    <input id="search" list="people" placeholder="Find a person">
    <datalist id="people"></datalist>
    <button id="home">Home</button>
    <button id="set-home">Set as home</button>
    <p id="showing"></p>
  </header>
  <p id="hint">Click on anyone to centre the tree on them</p>

  <!-- details about the selected person (filled in by showDetails below) -->
  <aside id="details"></aside>

  <!-- the tree gets drawn in here -->
  <div id="FamilyChart" class="f3"></div>

  <script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://unpkg.com/family-chart@0.9.0/dist/family-chart.min.js"></script>
  <script>
    fetch("/api/tree")
      .then(response => response.json())
      .then(data => {

        // look up anyone by their ID
        const people = {}
        for (const d of data) {
          people[d.id] = d
        }

        // fill the search list with "Name Surname (birth - death)" for everyone
        // (done before the chart is made, because the chart adds extra placeholder entries to data)
        const labels = {}
        const list = document.getElementById("people")
        for (const d of data) {
          const label = fullName(d) + " (" + d.data.years + ")"
          labels[label] = d.id
          const option = document.createElement("option")
          option.value = label
          list.appendChild(option)
        }

        function fullName(d) {
          return d.data["first name"] + " " + d.data["last name"]
        }

        // pick a word depending on gender, e.g. byGender(id, "Father", "Mother", "Parent")
        function byGender(id, male, female, other) {
          const gender = people[id].data.gender
          if (gender === "M") return male
          if (gender === "F") return female
          return other
        }

        // work out how everyone near the selected person is related to them
        function setRelations(mainId) {
          for (const d of data) {
            d.data.relation = ""
          }
          const label = (id, text) => {
            if (people[id] && !people[id].data.relation) people[id].data.relation = text
          }
          const main = people[mainId]
          label(mainId, "Selected person")

          // parents and grandparents
          for (const parent of main.rels.parents) {
            label(parent, byGender(parent, "Father", "Mother", "Parent"))
            for (const grandparent of people[parent].rels.parents) {
              label(grandparent, byGender(grandparent, "Grandfather", "Grandmother", "Grandparent"))
            }
          }

          // siblings: full if they share both parents, half if they share only one
          for (const parent of main.rels.parents) {
            for (const sibling of people[parent].rels.children) {
              if (sibling === mainId) continue
              const shared = people[sibling].rels.parents.filter(p => main.rels.parents.includes(p))
              const full = shared.length === 2 && main.rels.parents.length === 2
              label(sibling, full
                ? byGender(sibling, "Brother", "Sister", "Sibling")
                : byGender(sibling, "Half-brother", "Half-sister", "Half-sibling"))
            }
            // a parent's other partners are step-parents
            for (const partner of people[parent].rels.spouses) {
              if (!main.rels.parents.includes(partner)) {
                label(partner, byGender(partner, "Stepfather", "Stepmother", "Step-parent"))
              }
            }
          }

          // partners
          for (const partner of main.rels.spouses) {
            label(partner, byGender(partner, "Husband", "Wife", "Partner"))
          }

          // children, their partners, and grandchildren
          for (const child of main.rels.children) {
            label(child, byGender(child, "Son", "Daughter", "Child"))
            for (const partner of people[child].rels.spouses) {
              label(partner, byGender(partner, "Son-in-law", "Daughter-in-law", "Child's partner"))
            }
            for (const grandchild of people[child].rels.children) {
              label(grandchild, byGender(grandchild, "Grandson", "Granddaughter", "Grandchild"))
              for (const partner of people[grandchild].rels.spouses) {
                label(partner, "Grandchild's partner")
              }
            }
          }
        }

        // ---------- details panel ----------

        // a clickable name that moves the tree to that person
        function personLink(id) {
          const link = document.createElement("a")
          link.textContent = fullName(people[id]) + " (" + people[id].data.years + ")"
          link.addEventListener("click", () => showFamilyOf(id))
          return link
        }

        // a heading followed by a list of people (or a note if there's nobody)
        function addSection(panel, title, ids, extraText = {}) {
          const heading = document.createElement("h3")
          heading.textContent = title
          panel.appendChild(heading)

          if (ids.length === 0) {
            const note = document.createElement("p")
            note.className = "note"
            note.textContent = "None recorded"
            panel.appendChild(note)
            return
          }
          const list = document.createElement("ul")
          for (const id of ids) {
            const item = document.createElement("li")
            item.appendChild(personLink(id))
            if (extraText[id]) {
              const extra = document.createElement("span")
              extra.className = "note"
              extra.textContent = " " + extraText[id]
              item.appendChild(extra)
            }
            list.appendChild(item)
          }
          panel.appendChild(list)
        }

        function showDetails(id) {
          const person = people[id]
          const panel = document.getElementById("details")
          panel.innerHTML = ""

          const name = document.createElement("h2")
          name.textContent = fullName(person)
          panel.appendChild(name)
          const years = document.createElement("p")
          years.className = "years"
          years.textContent = person.data.years
          panel.appendChild(years)

          // parents
          addSection(panel, "Parents", person.rels.parents)

          // partners, each with the children they had together
          const partnersHeading = document.createElement("h3")
          partnersHeading.textContent = "Partners and children"
          panel.appendChild(partnersHeading)

          const partners = person.rels.spouses
          const childrenWithKnownPartner = new Set()
          for (const partner of partners) {
            const together = person.rels.children.filter(c => people[c].rels.parents.includes(partner))
            together.forEach(c => childrenWithKnownPartner.add(c))

            const partnerHeading = document.createElement("h4")
            partnerHeading.append("With ", personLink(partner))
            panel.appendChild(partnerHeading)
            addChildList(panel, together)
          }
          // children where the other parent isn't known
          const otherChildren = person.rels.children.filter(c => !childrenWithKnownPartner.has(c))
          if (otherChildren.length > 0) {
            const unknown = document.createElement("h4")
            unknown.textContent = "With an unknown partner"
            panel.appendChild(unknown)
            addChildList(panel, otherChildren)
          }
          if (partners.length === 0 && otherChildren.length === 0) {
            const note = document.createElement("p")
            note.className = "note"
            note.textContent = "None recorded"
            panel.appendChild(note)
          }

          // siblings: full ones share both parents, half ones share just one
          const full = []
          const half = []
          const halfThrough = {}
          for (const parent of person.rels.parents) {
            for (const sibling of people[parent].rels.children) {
              if (sibling === id || full.includes(sibling) || half.includes(sibling)) continue
              const shared = people[sibling].rels.parents.filter(p => person.rels.parents.includes(p))
              if (shared.length === 2 && person.rels.parents.length === 2) {
                full.push(sibling)
              } else {
                half.push(sibling)
                const role = byGender(parent, "father", "mother", "parent")
                halfThrough[sibling] = "(through their " + role + ")"
              }
            }
          }
          addSection(panel, "Brothers and sisters", full)
          addSection(panel, "Half-brothers and half-sisters", half, halfThrough)

          // step-parents: a parent's other partners
          const stepParents = []
          for (const parent of person.rels.parents) {
            for (const partner of people[parent].rels.spouses) {
              if (!person.rels.parents.includes(partner) && !stepParents.includes(partner)) {
                stepParents.push(partner)
              }
            }
          }
          if (stepParents.length > 0) {
            addSection(panel, "Step-parents", stepParents)
          }
        }

        function addChildList(panel, childIds) {
          if (childIds.length === 0) {
            const note = document.createElement("p")
            note.className = "note"
            note.textContent = "No children recorded"
            panel.appendChild(note)
            return
          }
          const list = document.createElement("ul")
          for (const child of childIds) {
            const item = document.createElement("li")
            item.appendChild(personLink(child))
            list.appendChild(item)
          }
          panel.appendChild(list)
        }

        // create the tree
        const chart = f3.createChart("#FamilyChart", data)
          .setCardXSpacing(250)
          .setCardYSpacing(150)
          .setAncestryDepth(2)          // show 2 generations above
          .setProgenyDepth(2)           // show 2 generations below
          .setShowSiblingsOfMain(true)  // show brothers and sisters

        // what goes on each card: name, years, then how they're related
        chart.setCardHtml()
          .setStyle("rect")             // plain cards with no person icon
          .setCardDisplay([["first name", "last name"], ["years"], ["relation"]])
          .setOnCardClick((e, d) => showFamilyOf(d.data.id))

        // centre the tree on someone and update the labels and the "showing" text
        // who the tree is currently centred on, and who the home person is
        let currentId = null
        let homeId = null

        function showFamilyOf(id, initial = false) {
          currentId = id
          setRelations(id)
          showDetails(id)
          updateHomeButtons()
          const person = people[id]
          document.getElementById("showing").innerHTML =
            "Showing the family of <strong>" + fullName(person) + "</strong> (" + person.data.years + ")"
          chart.updateMainId(id)
          chart.updateTree(initial
            ? { initial: true }
            : { tree_position: "main_to_middle" })   // keep the zoom level, just move to the person
        }

        // ---------- home person ----------

        const homeButton = document.getElementById("home")
        const setHomeButton = document.getElementById("set-home")

        // remember the home person in the browser, so it's still there after a refresh
        // (wrapped in try/catch because some browsers block saving, e.g. private windows)
        function loadSavedHome() {
          try {
            const saved = localStorage.getItem("homePerson")
            return saved && people[saved] ? saved : null
          } catch (e) {
            return null
          }
        }

        function saveHome(id) {
          try {
            localStorage.setItem("homePerson", id)
          } catch (e) {
            // saving isn't allowed, so it just lasts until the page is closed
          }
        }

        function updateHomeButtons() {
          if (!homeId) return
          homeButton.title = "Back to " + fullName(people[homeId])
          // no point setting someone as home if they already are
          setHomeButton.disabled = (currentId === homeId)
        }

        homeButton.addEventListener("click", () => showFamilyOf(homeId))

        setHomeButton.addEventListener("click", () => {
          homeId = currentId
          saveHome(homeId)
          updateHomeButtons()
        })

        // who to start on: the person in the address bar first, then the saved home person,
        // then just the first person in the data
        const idFromAddress = new URLSearchParams(window.location.search).get("id")
        const savedHome = loadSavedHome()
        homeId = savedHome || idFromAddress || data[0].id
        const startId = idFromAddress || homeId
        showFamilyOf(startId, true)

        // when someone picks a name from the search box, move the tree to them
        document.getElementById("search").addEventListener("change", e => {
          const id = labels[e.target.value]
          if (id) {
            showFamilyOf(id)
            e.target.value = ""
          }
        })
      })
  </script>
</body>
</html>
